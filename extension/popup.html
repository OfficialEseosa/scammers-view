<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scammer's View</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body { width: 340px; }
    </style>
  </head>
  <body>
    <h1><img src="icons/32.png" alt="" /> Scammer’s View</h1>
    <div class="stack">
      <button id="open-panel" type="button">Check a message</button>
      <p class="muted small">Tip: select text or a link on any page, right-click, and choose “Check with Scammer’s View”.</p>

      <div class="card">
        <label class="row">
          <input id="gmail" type="checkbox" />
          <span>
            <strong>Warn me in Gmail</strong><br />
            <span class="muted small">When you open an email, its text is sent to the Scammer’s View checker. It is compared with known scams and never stored. Off until you turn it on.</span>
          </span>
        </label>
      </div>

      <form id="app" class="card">
        <label for="app-url" class="small"><strong>App address</strong></label>
        <input id="app-url" type="url" required placeholder="https://your-app.example" />
        <button type="submit" class="secondary">Save</button>
        <p id="status" class="muted small" aria-live="polite"></p>
      </form>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
